name: Scan for leaked secrets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-for-leaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Gitleaks' git mode scans commit history, so a shallow checkout can
        # silently miss secrets introduced before the tip commit.
        fetch-depth: 0

    - name: Scan with Gitleaks
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/repo:ro" \
          zricethezav/gitleaks:v8.30.1 \
          git --verbose --redact --no-banner /repo
